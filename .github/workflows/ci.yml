name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh
      - name: Test OCR core
        run: ./Tests/run.sh
